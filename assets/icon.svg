<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6a3f"/>
      <stop offset="100%" stop-color="#3e8752"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fcf84"/>
      <stop offset="100%" stop-color="#b7e1ad"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Étiquette blanche -->
  <rect x="100" y="180" width="312" height="200" rx="24" ry="24" fill="white" opacity="0.95"/>
  <!-- Trou de l'étiquette -->
  <circle cx="256" cy="210" r="10" fill="#2f6a3f"/>
  <!-- Lignes de texte simulées -->
  <rect x="140" y="250" width="232" height="14" rx="7" fill="#2f6a3f" opacity="0.7"/>
  <rect x="140" y="280" width="180" height="14" rx="7" fill="#2f6a3f" opacity="0.5"/>
  <rect x="140" y="310" width="200" height="14" rx="7" fill="#2f6a3f" opacity="0.4"/>

  <!-- Feuille décorative en haut -->
  <g transform="translate(256, 84)">
    <ellipse cx="-30" cy="10" rx="45" ry="22" fill="url(#leaf)" transform="rotate(-30)"/>
    <ellipse cx="30" cy="10" rx="45" ry="22" fill="url(#leaf)" transform="rotate(30)"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#2f6a3f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
