<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sample - Division étiquette</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #e8e8e8;
  display: flex; flex-direction: column;
  align-items: center;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  padding: 30px;
  gap: 20px;
}

.label-preview {
  width: 345mm; height: 33mm;
  background: #fff;
  border: 0.5mm solid #333;
  position: relative;
  overflow: hidden;
  user-select: none;
}

.label-v {
  position: absolute; top: 0; bottom: 0;
  left: 285mm; width: 60mm; z-index: 5;
}
.label-v svg { width: 100%; height: 100%; display: block; }

.label-zone {
  position: absolute; top: 0; bottom: 0; left: 0;
  width: 285mm; display: flex; z-index: 1;
}

.col {
  height: 100%; position: relative;
  display: flex; flex-direction: column;
}
.col1 {
  background: #ffe0e0;
  align-items: center; justify-content: center;
}
.col1 .content {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 24pt; font-weight: bold; color: #c00;
}
.col2 { background: #e0ffe0; }
.col2 .row {
  flex: 1; border-bottom: 0.3mm dashed #0c0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16pt; color: #060; overflow: hidden;
}
.col3 { background: #e0e0ff; }
.col3 .row {
  flex: 1; border-bottom: 0.3mm dashed #00c;
  display: flex; align-items: center; justify-content: center;
  font-size: 14pt; color: #006; overflow: hidden;
}
.col .row:last-child { border-bottom: none; }

.handle {
  position: absolute; top: 0; bottom: 0;
  width: 8px; cursor: col-resize; z-index: 10;
  background: transparent;
}
.handle:hover, .handle.active { background: rgba(0,0,0,0.15); }
.handle::after {
  content: '⋮';
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 18pt; color: #666; pointer-events: none;
}

.dim {
  position: absolute; font-size: 10pt; color: #333; z-index: 8;
  background: rgba(255,255,200,0.95); padding: 1px 4px;
  border: 0.5px solid #999;
}

.info {
  font-size: 14pt; color: #333;
  background: #fff; padding: 8px 16px;
  border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.info b { color: #c00; }
</style>
</head>
<body>

<div class="label-preview" id="labelPreview">
  <div class="label-v">
    <svg viewBox="0 0 20 11" preserveAspectRatio="none">
      <line x1="0" y1="0" x2="20" y2="5.5" stroke="#999" stroke-width="0.3"/>
      <line x1="0" y1="11" x2="20" y2="5.5" stroke="#999" stroke-width="0.3"/>
    </svg>
  </div>

  <div class="label-zone" id="labelZone">
    <div class="col col1" id="col1"><div class="content">PRIX</div></div>
    <div class="handle" id="handle1"></div>
    <div class="col col2" id="col2">
      <div class="row">Ligne A</div>
      <div class="row">Ligne B</div>
    </div>
    <div class="handle" id="handle2"></div>
    <div class="col col3" id="col3">
      <div class="row">Ligne 1</div>
      <div class="row">Ligne 2</div>
      <div class="row">Ligne 3</div>
    </div>
  </div>

  <div class="dim" style="top:-18mm;left:0">0</div>
  <div class="dim" id="dim1" style="top:-18mm">15mm</div>
  <div class="dim" id="dim2" style="top:-18mm">55mm</div>
  <div class="dim" style="top:-18mm;left:284mm">95mm</div>
  <div class="dim" style="top:-18mm;right:0">115mm</div>
</div>

<div class="info">
  Col 1 (prix) : <b id="w1">15.0</b> mm &nbsp;|&nbsp;
  Col 2 : <b id="w2">40.0</b> mm &nbsp;|&nbsp;
  Col 3 : <b id="w3">40.0</b> mm &nbsp;|&nbsp;
  Total : <b id="wTotal">95.0</b> / 95 mm &nbsp;
  <small style="color:#888">(Échelle ×3, tire les poignées ⋮)</small>
</div>

<script>
const ZONE_W = 285;
const MIN_W  = 9;    /* 3mm réel minimum */
const SCALE  = 3;

let col1W = 45, col2W = 120, col3W = 120;

const col1El = document.getElementById('col1');
const col2El = document.getElementById('col2');
const col3El = document.getElementById('col3');
const dim1El = document.getElementById('dim1');
const dim2El = document.getElementById('dim2');

let dragging = null, startX = 0, startW1 = 0, startW2 = 0;

function apply() {
  col1El.style.width = col1W + 'mm';
  col2El.style.width = col2W + 'mm';
  col3El.style.width = col3W + 'mm';
  dim1El.style.left = (col1W - 5) + 'mm';
  dim2El.style.left = (col1W + col2W - 5) + 'mm';
  document.getElementById('handle1').style.left = col1W + 'mm';
  document.getElementById('handle2').style.left = (col1W + col2W) + 'mm';
  document.getElementById('w1').textContent = (col1W/SCALE).toFixed(1);
  document.getElementById('w2').textContent = (col2W/SCALE).toFixed(1);
  document.getElementById('w3').textContent = (col3W/SCALE).toFixed(1);
  document.getElementById('wTotal').textContent = ((col1W+col2W+col3W)/SCALE).toFixed(1);
}

function onDown(e, idx) {
  dragging = idx;
  startX = e.clientX;
  startW1 = col1W;
  startW2 = col2W;
  document.querySelectorAll('.handle').forEach(h=>h.classList.add('active'));
  document.body.style.cursor = 'col-resize';
  e.preventDefault();
}
function onMove(e) {
  if (!dragging) return;
  const dx = e.clientX - startX;
  if (dragging === 1) {
    let w1 = startW1 + dx, w2 = startW2 - dx;
    if (w1 < MIN_W) { const d = MIN_W - w1; w1 = MIN_W; w2 -= d; }
    if (w2 < MIN_W) { const d = MIN_W - w2; w2 = MIN_W; w1 -= d; }
    if (w1 + w2 > ZONE_W - MIN_W) w2 = ZONE_W - MIN_W - w1;
    col1W = w1; col2W = w2; col3W = ZONE_W - w1 - w2;
  } else {
    let w2 = startW2 + dx;
    if (w2 < MIN_W) w2 = MIN_W;
    if (startW1 + w2 > ZONE_W - MIN_W) w2 = ZONE_W - MIN_W - startW1;
    col1W = startW1; col2W = w2; col3W = ZONE_W - startW1 - w2;
  }
  apply();
}
function onUp() {
  if (!dragging) return;
  dragging = null;
  document.querySelectorAll('.handle').forEach(h=>h.classList.remove('active'));
  document.body.style.cursor = '';
}
document.getElementById('handle1').addEventListener('mousedown', e=>onDown(e,1));
document.getElementById('handle2').addEventListener('mousedown', e=>onDown(e,2));
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onUp);
apply();
</script>
</body>
</html>
