<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #e8e8e8; display: flex; justify-content: center; padding: 20px; font-family: sans-serif; }

.page {
  width: 210mm;
  height: 297mm;
  background: #fff;
  box-shadow: 0 2px 20px rgba(0,0,0,0.15);
  position: relative;
}

/* Ligne centrale */
.center-line {
  position: absolute;
  top: 0; bottom: 0;
  left: 105mm;
  border-left: 0.3mm dashed #f66;
  z-index: 5;
}

/* Colonne gauche : top = 30.25mm */
.col-left {
  position: absolute;
  top: 30.25mm;
  left: 0;
  width: 105mm;
  display: flex;
  flex-direction: column;
}

/* Colonne droite : plus haute de 5.5mm, top = 24.75mm */
.col-right {
  position: absolute;
  top: 24.75mm;
  right: 0;
  width: 105mm;
  display: flex;
  flex-direction: column;
}

.label {
  width: 105mm;
  height: 11mm;
  border-bottom: 0.15mm solid #999;
  font-size: 6pt;
  color: #666;
  display: flex;
  align-items: center;
  padding: 0 2mm;
}
.label:nth-child(odd) { background: #fafafa; }

/* Première étiquette de chaque colonne = bordure haute */
.col-left .label:first-child {
  border-top: 0.15mm solid #999;
}
/* Colonne droite rotatée → le dernier enfant est visuellement en haut */
.col-right .label:last-child {
  border-top: 0.15mm solid #999;
}

/* Colonne droite rotatée 180° */
.col-right .label {
  transform: rotate(180deg);
}

/* Dimensions overlay */
.dim { position: absolute; font-size: 7pt; color: #666; z-index: 20; }
.dim-w { top: 2mm; left: 50%; transform: translateX(-50%); }
.dim-l { top: 2mm; left: 52.5mm; transform: translateX(-50%); }
.dim-r { top: 2mm; right: 52.5mm; transform: translateX(50%); }
.dim-d { top: 6mm; left: 105mm; transform: translateX(-50%); background: #f66; color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 6pt; }

.legend {
  position: absolute;
  bottom: 5mm;
  left: 50%;
  transform: translateX(-50%);
  font-size: 7pt;
  color: #666;
  background: rgba(255,255,255,0.9);
  padding: 3mm 5mm;
  border: 0.3mm solid #ccc;
  border-radius: 2mm;
  z-index: 20;
  text-align: center;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="page">
  <div class="center-line"></div>
  <div class="dim dim-w">← 210 mm →</div>
  <div class="dim dim-l">105 mm</div>
  <div class="dim dim-r">105 mm</div>
  <div class="dim dim-d">décalage 5.5 mm</div>

  <div class="col-left" id="colLeft"></div>
  <div class="col-right" id="colRight"></div>

  <div class="legend">
    <b>Étiquettes 11×105 mm · 2 colonnes · A4 portrait</b><br>
    Bloc centré verticalement · 22 étiquettes × 2 = 44 par page<br>
    Bloc total 247.5 mm (242 + 5.5 décalage) · Marges 24.75 mm<br>
    Gauche: top 30.25 mm · Droite: top 24.75 mm (−5.5) · rotatée 180°
  </div>
</div>

<script>
const ROWS = 22;
const colLeft = document.getElementById('colLeft');
const colRight = document.getElementById('colRight');

for (let i = 0; i < ROWS; i++) {
  const l = document.createElement('div');
  l.className = 'label';
  l.textContent = 'G' + (i + 1);
  colLeft.appendChild(l);

  const r = document.createElement('div');
  r.className = 'label';
  r.textContent = 'D' + (i + 1);
  colRight.appendChild(r);
}

// Affiche le compte réel
const counter = document.createElement('div');
counter.style.cssText = 'position:absolute;bottom:1mm;left:5mm;font-size:7pt;color:red;z-index:30;';
counter.textContent = 'Gauche: ' + colLeft.children.length + ' · Droite: ' + colRight.children.length + ' · Total: ' + (colLeft.children.length + colRight.children.length);
document.querySelector('.page').appendChild(counter);
</script>
</body>
</html>
